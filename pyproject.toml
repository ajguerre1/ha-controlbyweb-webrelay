[tool.ruff]
line-length = 100
# Pinned, NOT inferred, and pinned to what Home Assistant actually requires rather than to what a
# sibling project happened to use: `homeassistant==2026.9.0` declares `requires_python >=3.14.2`.
# An earlier version of this file said 3.13, copied from a repo targeting 2026.8. That was wrong,
# and it was not a harmless kind of wrong -- CI installed Python 3.13, pip could not install
# 2026.9.0 there, and rather than failing it silently backtracked through
# pytest-homeassistant-custom-component releases to one pinning homeassistant 2026.2.3. The tests
# then failed with `cannot import name 'async_get_unit'`, which reads as a bug in this integration
# rather than as an interpreter three versions too old.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Home Assistant config-flow style relies on calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
